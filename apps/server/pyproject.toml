[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v-open-agent"
version = "0.0.1"
description = "Evidence-based real-time risk decision engine for smart glasses on a local edge server"
readme = "00-readme.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 (proposed, pending owner approval)" }
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]   # 문서의 코드 블록은 포맷하지 않는다

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = ["model: requires real model weights (excluded by default)"]
